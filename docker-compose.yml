# Stage 0-2 services. api/orchestrator/frontend are added by their owners as they land.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    ports: ["${POSTGRES_PORT:-5432}:5432"]   # set POSTGRES_PORT if a native Postgres already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena}"]
      interval: 5s
      retries: 10

  migrate:   # one-shot: applies pending db/migrations in order, then exits (docs/07 section 9)
    build: { context: ., dockerfile: proxy/Dockerfile }   # reuses the Python + psycopg image
    command: ["python", "db/migrate.py"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-arena}
      PGPASSWORD: ${POSTGRES_PASSWORD:-arena}
      PGDATABASE: ${POSTGRES_DB:-arena}
    volumes: ["./db:/app/db:ro"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  bifrost:
    # Pinned by digest after the A1 smoke test (2026-11-14); the image carries no version label.
    image: maximhq/bifrost@sha256:5ec9873acaf1687556b6e4dd854b92b539d9debf87a5a683b66338648b84d3c8
    # Bound to this machine only: inference needs no virtual key (bifrost/config.json), so it must
    # not be reachable from the network. Other services reach it as http://bifrost:8080.
    ports: ["127.0.0.1:${BIFROST_PORT:-8080}:8080"]
    environment:
      # One-time secret required by Bifrost before its dashboard can be set up; set it in .env.
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      # Provider keys live only in .env and only in this container (never proxy/agents).
      # bifrost/config.json references them as env.GROQ_API_KEY etc.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./data/bifrost:/app/data                           # Bifrost's own DB + logs (git-ignored)
      - ./bifrost/config.json:/app/data/config.json:ro     # providers, no secrets

  proxy:   # A4 measuring proxy; agents use OPENAI_BASE_URL=http://<host>:${PROXY_PORT}/runs/<run_id>/v1
    build: { context: ., dockerfile: proxy/Dockerfile }
    environment:
      # libpq connection variables (no credentials inside a URL)
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-arena}
      PGPASSWORD: ${POSTGRES_PASSWORD:-arena}
      PGDATABASE: ${POSTGRES_DB:-arena}
      # Bifrost by default; for zero-cost dev: UPSTREAM_BASE_URL=http://mock_llm:9000/v1 with --profile mock
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://bifrost:8080/v1}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["${PROXY_PORT:-8001}:8001"]
    volumes:   # edits apply on restart, no rebuild
      - ./pricing.yaml:/app/pricing.yaml:ro
      - ./faults:/app/faults:ro           # provider fault catalog (A7), validated at startup
    depends_on:
      migrate: { condition: service_completed_successfully }

  mock_llm:
    image: python:3.12-alpine
    profiles: ["mock"]
    command: python /app/server.py
    environment: { MOCK_PORT: "9000" }
    ports: ["${MOCK_LLM_PORT:-9000}:9000"]
    volumes: ["./mock_llm:/app:ro"]

  api:   # A5 dashboard REST API + stats (docs/08 section 3); OpenAPI at http://localhost:${API_PORT}/docs
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      # libpq connection variables (no credentials inside a URL)
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-arena}
      PGPASSWORD: ${POSTGRES_PASSWORD:-arena}
      PGDATABASE: ${POSTGRES_DB:-arena}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./faults:/app/faults:ro"]   # scenario catalog read at request time
    depends_on:
      migrate: { condition: service_completed_successfully }   # tables must exist

volumes:
  pgdata:
